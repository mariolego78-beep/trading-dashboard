<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Market Heatmap</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@300;400;500;600&family=IBM+Plex+Sans:wght@300;400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080c08;
    --bg2: #0d120d;
    --bg3: #111811;
    --border: rgba(0,255,80,0.08);
    --border2: rgba(0,255,80,0.15);
    --green-dim: #1a3d1a;
    --red-dim: #3d1a1a;
    --text: #c8d8c8;
    --text-muted: #5a7a5a;
    --text-bright: #e8f5e8;
    --accent: #00c840;
    --accent-dim: rgba(0,200,64,0.15);
    --gold: #c8a020;
    --gold-dim: rgba(200,160,32,0.2);
    --font-mono: 'IBM Plex Mono', monospace;
    --font-sans: 'IBM Plex Sans', sans-serif;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-mono);
    min-height: 100vh;
    padding: 0;
  }

  /* Scanline effect */
  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(0deg, transparent, transparent 2px, rgba(0,0,0,0.03) 2px, rgba(0,0,0,0.03) 4px);
    pointer-events: none;
    z-index: 9999;
  }

  header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border2);
    background: var(--bg2);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .logo {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .logo-mark {
    width: 28px;
    height: 28px;
    border: 1.5px solid var(--accent);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 11px;
    color: var(--accent);
    font-weight: 600;
    letter-spacing: 0.05em;
  }

  .logo-text {
    font-size: 12px;
    font-weight: 500;
    color: var(--text-bright);
    letter-spacing: 0.12em;
    text-transform: uppercase;
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .clock {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.06em;
  }

  .clock span { color: var(--accent); }

  .refresh-btn {
    background: transparent;
    border: 1px solid var(--border2);
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 5px 12px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.2s;
  }

  .refresh-btn:hover {
    border-color: var(--accent);
    color: var(--accent);
    background: var(--accent-dim);
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  main { padding: 20px 24px; }

  /* Stats bar */
  .stats-bar {
    display: flex;
    gap: 2px;
    margin-bottom: 20px;
  }

  .stat {
    flex: 1;
    background: var(--bg2);
    border: 1px solid var(--border);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .stat-label {
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .stat-value {
    font-size: 15px;
    font-weight: 500;
    color: var(--text-bright);
  }

  .stat-value.up { color: #00c840; }
  .stat-value.down { color: #e04040; }

  /* Heatmap grid */
  .heatmap { display: flex; flex-direction: column; gap: 16px; }

  .sector-block { }

  .sector-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 6px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--border);
  }

  .sector-name {
    font-size: 9px;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--text-muted);
    font-weight: 500;
  }

  .sector-line {
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .sector-avg {
    font-size: 9px;
    letter-spacing: 0.06em;
  }

  .cells-row {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
  }

  .cell {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: filter 0.15s, transform 0.1s;
    border: 1px solid transparent;
    overflow: hidden;
  }

  .cell::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,255,255,0.04) 0%, transparent 60%);
    pointer-events: none;
  }

  .cell:hover {
    filter: brightness(1.25);
    transform: scale(1.02);
    z-index: 10;
    border-color: rgba(255,255,255,0.2);
  }

  .cell.portfolio-owned {
    border-color: var(--gold) !important;
    box-shadow: 0 0 8px rgba(200,160,32,0.3), inset 0 0 12px rgba(200,160,32,0.05);
  }

  .cell.portfolio-owned::before {
    content: '◆';
    position: absolute;
    top: 3px;
    right: 4px;
    font-size: 6px;
    color: var(--gold);
    z-index: 2;
  }

  .cell-ticker {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.04em;
    line-height: 1;
    color: rgba(255,255,255,0.9);
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  .cell-name {
    font-size: 8px;
    line-height: 1;
    margin-top: 2px;
    color: rgba(255,255,255,0.55);
    font-family: var(--font-sans);
    font-weight: 300;
    max-width: 90%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    text-align: center;
  }

  .cell-pct {
    font-size: 12px;
    font-weight: 500;
    line-height: 1;
    margin-top: 4px;
    color: rgba(255,255,255,0.92);
    text-shadow: 0 1px 2px rgba(0,0,0,0.5);
  }

  /* Tooltip */
  .tooltip {
    position: fixed;
    z-index: 9998;
    background: #0a140a;
    border: 1px solid var(--border2);
    padding: 12px 14px;
    font-size: 11px;
    line-height: 1.8;
    pointer-events: none;
    display: none;
    min-width: 200px;
    box-shadow: 0 8px 32px rgba(0,0,0,0.6);
  }

  .tooltip-ticker {
    font-size: 13px;
    font-weight: 600;
    color: var(--text-bright);
    margin-bottom: 4px;
  }

  .tooltip-name {
    font-size: 10px;
    color: var(--text-muted);
    margin-bottom: 8px;
    font-family: var(--font-sans);
    font-weight: 300;
  }

  .tooltip-row {
    display: flex;
    justify-content: space-between;
    gap: 20px;
    font-size: 10px;
  }

  .tooltip-label { color: var(--text-muted); }
  .tooltip-val { color: var(--text-bright); font-weight: 500; }
  .tooltip-val.up { color: #00c840; }
  .tooltip-val.down { color: #e04040; }
  .tooltip-val.gold { color: var(--gold); }

  .tooltip-divider {
    height: 1px;
    background: var(--border);
    margin: 6px 0;
  }

  /* Legend */
  .legend {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-top: 20px;
    padding-top: 14px;
    border-top: 1px solid var(--border);
  }

  .legend-label { font-size: 10px; color: var(--text-muted); letter-spacing: 0.06em; }

  .legend-bar {
    display: flex;
    height: 4px;
    flex: 1;
    max-width: 240px;
    border-radius: 2px;
    overflow: hidden;
  }

  .legend-note {
    font-size: 9px;
    color: var(--text-muted);
    margin-left: auto;
    letter-spacing: 0.04em;
  }

  .legend-portfolio {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--gold);
    margin-left: 20px;
  }

  .legend-portfolio-dot {
    width: 8px;
    height: 8px;
    border: 1.5px solid var(--gold);
  }

  /* Loading / error */
  .loading-screen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 300px;
    gap: 16px;
  }

  .loading-bar {
    width: 200px;
    height: 2px;
    background: var(--border2);
    overflow: hidden;
    border-radius: 1px;
  }

  .loading-bar-inner {
    height: 100%;
    background: var(--accent);
    animation: loading 1.5s infinite;
    border-radius: 1px;
  }

  @keyframes loading {
    0% { width: 0%; margin-left: 0; }
    50% { width: 60%; margin-left: 20%; }
    100% { width: 0%; margin-left: 100%; }
  }

  .loading-text {
    font-size: 11px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
  }

  .error-msg {
    font-size: 12px;
    color: #e04040;
    text-align: center;
    padding: 40px;
    letter-spacing: 0.06em;
  }

  /* URL config box */
  .config-bar {
    background: var(--bg2);
    border: 1px solid var(--border2);
    padding: 10px 16px;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
  }

  .config-label {
    font-size: 9px;
    color: var(--text-muted);
    letter-spacing: 0.1em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .config-input {
    flex: 1;
    background: transparent;
    border: none;
    border-bottom: 1px solid var(--border2);
    color: var(--text);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 4px 0;
    outline: none;
    min-width: 200px;
  }

  .config-input:focus { border-bottom-color: var(--accent); }

  .config-btn {
    background: var(--accent-dim);
    border: 1px solid var(--accent);
    color: var(--accent);
    font-family: var(--font-mono);
    font-size: 10px;
    padding: 5px 14px;
    cursor: pointer;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .config-btn:hover { background: var(--accent); color: #000; }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-mark">HM</div>
    <span class="logo-text">Market Heatmap</span>
  </div>
  <div class="header-right">
    <div style="display:flex;align-items:center;gap:6px;">
      <div class="status-dot" id="statusDot"></div>
      <span class="clock" id="clockEl">--:--:--</span>
    </div>
    <button class="refresh-btn" onclick="loadData()">↻ Refresh</button>
  </div>
</header>

<main>
  <!-- Stats bar -->
  <div class="stats-bar" id="statsBar">
    <div class="stat"><div class="stat-label">Titoli</div><div class="stat-value" id="s-count">—</div></div>
    <div class="stat"><div class="stat-label">In rialzo</div><div class="stat-value up" id="s-up">—</div></div>
    <div class="stat"><div class="stat-label">In ribasso</div><div class="stat-value down" id="s-down">—</div></div>
    <div class="stat"><div class="stat-label">Var. media</div><div class="stat-value" id="s-avg">—</div></div>
    <div class="stat"><div class="stat-label">Migliore</div><div class="stat-value up" id="s-best">—</div></div>
    <div class="stat"><div class="stat-label">Peggiore</div><div class="stat-value down" id="s-worst">—</div></div>
  </div>

  <!-- Config bar -->
  <div class="config-bar">
    <span class="config-label">CSV URL</span>
    <input class="config-input" id="csvUrl" type="text" placeholder="Incolla qui il link CSV di Google Sheets..." />
    <button class="config-btn" onclick="saveAndLoad()">Carica</button>
  </div>

  <!-- Heatmap -->
  <div id="heatmap"><div class="loading-screen"><div class="loading-bar"><div class="loading-bar-inner"></div></div><div class="loading-text">Caricamento dati...</div></div></div>

  <!-- Legend -->
  <div class="legend">
    <span class="legend-label">-5%</span>
    <div class="legend-bar" id="legendBar"></div>
    <span class="legend-label">+5%</span>
    <div class="legend-portfolio">
      <div class="legend-portfolio-dot"></div>
      <span>In portafoglio</span>
    </div>
    <span class="legend-note" id="lastUpdate">Ultimo aggiornamento: —</span>
  </div>
</main>

<div class="tooltip" id="tooltip"></div>

<script>
const STORAGE_KEY = 'heatmap_csv_url';
const DEFAULT_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vT40hSGVs7U2cdU7UuEBylTC5u6z3oPDTNW2rInstiVo65Uw0_UneUus1WWUngkM0lw6V9mQlXRUbS7/pub?gid=0&single=true&output=csv';

// Portfolio tickers (aggiungi qui i tuoi ticker posseduti)
const PORTFOLIO = ['NVDA', 'TSM', 'SMCI', 'RACE'];

function getColor(pct) {
  const p = Math.max(-5, Math.min(5, pct));
  if (p >= 0) {
    const t = p / 5;
    const l = 12 + t * 18;
    const s = 35 + t * 45;
    return `hsl(125,${s}%,${l}%)`;
  } else {
    const t = Math.abs(p) / 5;
    const l = 12 + t * 18;
    const s = 35 + t * 45;
    return `hsl(0,${s}%,${l}%)`;
  }
}

function parseCSV(text) {
  const lines = text.trim().split('\n');
  if (lines.length < 2) return [];
  const headers = lines[0].split(',').map(h => h.trim().replace(/"/g,'').toLowerCase());
  return lines.slice(1).map(line => {
    const vals = line.match(/(".*?"|[^,]+|(?<=,)(?=,)|^(?=,)|(?<=,)$)/g) || [];
    const obj = {};
    headers.forEach((h, i) => {
      obj[h] = (vals[i] || '').trim().replace(/"/g,'');
    });
    return obj;
  }).filter(r => r.ticker || r['ticker']);
}

function groupBySector(rows) {
  const sectors = {};
  rows.forEach(r => {
    const sec = r.settore || r.sector || r['settore'] || 'Altro';
    if (!sectors[sec]) sectors[sec] = [];
    sectors[sec].push(r);
  });
  return sectors;
}

function updateStats(rows) {
  const pcts = rows.map(r => parseFloat(r['variazione%'] || r.variazione || r['changepct'] || 0)).filter(v => !isNaN(v));
  const up = pcts.filter(v => v > 0).length;
  const down = pcts.filter(v => v < 0).length;
  const avg = pcts.reduce((a,b) => a+b, 0) / pcts.length;
  const best = Math.max(...pcts);
  const worst = Math.min(...pcts);
  const bestRow = rows.find(r => parseFloat(r['variazione%'] || 0) === best);
  const worstRow = rows.find(r => parseFloat(r['variazione%'] || 0) === worst);

  document.getElementById('s-count').textContent = rows.length;
  document.getElementById('s-up').textContent = up;
  document.getElementById('s-down').textContent = down;
  const avgEl = document.getElementById('s-avg');
  avgEl.textContent = (avg >= 0 ? '+' : '') + avg.toFixed(2) + '%';
  avgEl.className = 'stat-value ' + (avg >= 0 ? 'up' : 'down');
  document.getElementById('s-best').textContent = (bestRow ? bestRow.ticker + ' ' : '') + '+' + best.toFixed(2) + '%';
  document.getElementById('s-worst').textContent = (worstRow ? worstRow.ticker + ' ' : '') + worst.toFixed(2) + '%';
}

function buildLegend() {
  const bar = document.getElementById('legendBar');
  bar.innerHTML = '';
  for (let i = 0; i <= 40; i++) {
    const d = document.createElement('div');
    d.style.flex = '1';
    d.style.background = getColor(-5 + i * 0.25);
    bar.appendChild(d);
  }
}

function renderHeatmap(rows) {
  const container = document.getElementById('heatmap');
  const sectors = groupBySector(rows);
  container.innerHTML = '';

  const hm = document.createElement('div');
  hm.className = 'heatmap';

  Object.entries(sectors).forEach(([sectorName, stocks]) => {
    const block = document.createElement('div');
    block.className = 'sector-block';

    const avgPct = stocks.reduce((a,b) => a + parseFloat(b['variazione%'] || 0), 0) / stocks.length;
    const avgColor = avgPct >= 0 ? '#00c840' : '#e04040';

    block.innerHTML = `
      <div class="sector-header">
        <span class="sector-name">${sectorName}</span>
        <div class="sector-line"></div>
        <span class="sector-avg" style="color:${avgColor}">${avgPct >= 0 ? '+' : ''}${avgPct.toFixed(2)}%</span>
      </div>
      <div class="cells-row" id="row-${sectorName.replace(/\s/g,'')}"></div>`;

    hm.appendChild(block);

    const row = block.querySelector('.cells-row');

    stocks.forEach(s => {
      const ticker = (s.ticker || '').toUpperCase();
      const nome = s.nome || s.name || ticker;
      const pct = parseFloat(s['variazione%'] || s.variazione || 0);
      const mcap = parseFloat(s['market cap'] || s.marketcap || s['market_cap'] || 100);
      const prezzo = parseFloat(s.prezzo || s.price || 0);
      const high52 = parseFloat(s['52w_high'] || s.high52 || 0);
      const low52 = parseFloat(s['52w_low'] || s.low52 || 0);
      const isOwned = PORTFOLIO.includes(ticker);

      const size = Math.round(Math.sqrt(mcap) * 6.5);
      const h = Math.max(60, Math.round(size * 0.62));
      const w = Math.max(70, size);

      const cell = document.createElement('div');
      cell.className = 'cell' + (isOwned ? ' portfolio-owned' : '');
      cell.style.width = w + 'px';
      cell.style.height = h + 'px';
      cell.style.background = getColor(pct);

      cell.innerHTML = `
        <span class="cell-ticker">${ticker}</span>
        <span class="cell-name">${nome}</span>
        <span class="cell-pct">${pct >= 0 ? '+' : ''}${pct.toFixed(2)}%</span>`;

      const tooltip = document.getElementById('tooltip');

      cell.addEventListener('mousemove', e => {
        tooltip.style.display = 'block';
        const x = e.clientX + 16;
        const y = e.clientY - 10;
        tooltip.style.left = Math.min(x, window.innerWidth - 220) + 'px';
        tooltip.style.top = y + 'px';

        const pnlHtml = isOwned ? `
          <div class="tooltip-divider"></div>
          <div class="tooltip-row"><span class="tooltip-label">◆ In portafoglio</span><span class="tooltip-val gold">Sì</span></div>` : '';

        const rangeHtml = (high52 && low52) ? `
          <div class="tooltip-row"><span class="tooltip-label">52w High</span><span class="tooltip-val">${high52.toLocaleString('it-IT', {minimumFractionDigits:2})}</span></div>
          <div class="tooltip-row"><span class="tooltip-label">52w Low</span><span class="tooltip-val">${low52.toLocaleString('it-IT', {minimumFractionDigits:2})}</span></div>` : '';

        tooltip.innerHTML = `
          <div class="tooltip-ticker">${ticker}</div>
          <div class="tooltip-name">${nome} · ${sectorName}</div>
          <div class="tooltip-row"><span class="tooltip-label">Variazione</span><span class="tooltip-val ${pct>=0?'up':'down'}">${pct>=0?'+':''}${pct.toFixed(2)}%</span></div>
          ${prezzo ? `<div class="tooltip-row"><span class="tooltip-label">Prezzo</span><span class="tooltip-val">$${prezzo.toLocaleString('it-IT', {minimumFractionDigits:2})}</span></div>` : ''}
          ${rangeHtml}
          <div class="tooltip-row"><span class="tooltip-label">Market Cap</span><span class="tooltip-val">$${mcap.toLocaleString('it-IT')}B</span></div>
          ${pnlHtml}`;
      });

      cell.addEventListener('mouseleave', () => tooltip.style.display = 'none');
      row.appendChild(cell);
    });
  });

  container.appendChild(hm);
  updateStats(rows);
  buildLegend();

  const now = new Date();
  document.getElementById('lastUpdate').textContent = 'Aggiornato: ' + now.toLocaleTimeString('it-IT');
}

async function loadData() {
  const url = document.getElementById('csvUrl').value.trim() || localStorage.getItem(STORAGE_KEY) || DEFAULT_URL;
  document.getElementById('heatmap').innerHTML = '<div class="loading-screen"><div class="loading-bar"><div class="loading-bar-inner"></div></div><div class="loading-text">Caricamento dati...</div></div>';

  try {
    const proxyUrl = 'https://corsproxy.io/?' + encodeURIComponent(url);
    let resp = await fetch(proxyUrl);
    if (!resp.ok) resp = await fetch(url);
    const text = await resp.text();
    const rows = parseCSV(text);
    if (!rows.length) throw new Error('Nessun dato trovato');
    renderHeatmap(rows);
  } catch(e) {
    document.getElementById('heatmap').innerHTML = `<div class="error-msg">⚠ Errore nel caricamento dei dati.<br><br>Verifica che il link CSV sia corretto e che il foglio sia pubblicato pubblicamente.<br><br><small>${e.message}</small></div>`;
  }
}

function saveAndLoad() {
  const url = document.getElementById('csvUrl').value.trim();
  if (url) localStorage.setItem(STORAGE_KEY, url);
  loadData();
}

// Clock
function updateClock() {
  const now = new Date();
  document.getElementById('clockEl').innerHTML = now.toLocaleDateString('it-IT') + ' <span>' + now.toLocaleTimeString('it-IT') + '</span>';
}

// Init
window.addEventListener('DOMContentLoaded', () => {
  const saved = localStorage.getItem(STORAGE_KEY) || DEFAULT_URL;
  document.getElementById('csvUrl').value = saved;
  buildLegend();
  updateClock();
  setInterval(updateClock, 1000);
  loadData();
  // Auto-refresh ogni 5 minuti
  setInterval(loadData, 5 * 60 * 1000);
});
</script>
</body>
</html>
